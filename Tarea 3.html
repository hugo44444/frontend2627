<!DOCTYPE html>
<html>
<head>
    <title>Etiquetas de texto</title>
</head>
<body>

<h1>Mi página web</h1>

<h2>Etiquetas de texto</h2>

<h3>Ejemplo de título</h3>
<p>Este es un párrafo de ejemplo.</p>

<p><b>Texto en negrita</b></p>
<p><i>Texto en cursiva</i></p>
<p><u>Texto subrayado</u></p>
<p><mark>Texto marcado</mark></p>
<p><small>Texto pequeño</small></p>
<p><del>Texto tachado</del></p>

<p>H<sub>2</sub>O</p>
<p>2<sup>2</sup> = 4</p>

<p>Primera línea<br>Segunda línea</p>

<hr>

<h2>Más etiquetas</h2>

<p><strong>Texto importante</strong></p>
<p><em>Texto destacado</em></p>
<blockquote>Esto es una cita.</blockquote>

</body>
</html>
